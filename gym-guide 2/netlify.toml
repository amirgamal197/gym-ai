# Netlify configuration for a plain static site (no build step, no
# Netlify Functions). This app is pure HTML/CSS/ES-module JS that
# reads/writes localStorage in the browser — nothing here needs a
# server runtime, so this file only tells Netlify where the site
# lives and sets a couple of caching headers that matter for a PWA.

[build]
  # Site root is the publish directory — index.html, manifest.json,
  # service-worker.js, css/, js/, and icons/ are all served as-is.
  publish = "."
  # No build command: there is no bundler/transpiler step. Shipping
  # an explicit empty command (instead of omitting it) stops Netlify's
  # zero-config auto-detection from guessing a Node/Vite/etc. build.
  command = ""

# service-worker.js controls PWA offline caching itself (see its own
# CACHE_NAME versioning). If Netlify's CDN also cached this file, a
# redeploy could take a long time to actually reach return visitors.
# no-cache forces the browser to always revalidate it with Netlify,
# so a bumped CACHE_NAME is picked up immediately.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

# The PWA manifest should also always be revalidated — it rarely
# changes, but when it does (icons, name, colors) it should take
# effect on the next load rather than waiting out a long CDN cache.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

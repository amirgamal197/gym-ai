<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Personal AI Trainer — تضخيم + تصحيح القوام</title>
<meta name="description" content="Personal AI Trainer — دليل تدريب شخصي بالذكاء الاصطناعي: تضخيم عضلي وتصحيح Anterior Pelvic Tilt، مع تتبع أوزان وتصحيح قوام وتغذية.">
<meta name="theme-color" content="#0a0b0e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#mainContent">تخطي إلى المحتوى</a>

<header class="glass">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">AI</span>
    <div class="brand-text">
      <h1>Personal AI Trainer</h1>
      <p class="brand-program">Hypertrophy &amp; APT Correction <span class="brand-program-ar">· تضخيم + تصحيح القوام</span></p>
    </div>
  </div>
</header>

<nav id="tabs" class="glass" aria-label="أقسام التطبيق">
  <button data-tab="dashboard" class="active">Dashboard <span class="tab-ar">الرئيسية</span></button>
  <button data-tab="program">Program <span class="tab-ar">البرنامج</span></button>
  <button data-tab="exercises">Exercises <span class="tab-ar">التمارين</span></button>
  <button data-tab="support">Support <span class="tab-ar">الدعم</span></button>
</nav>

<div id="offlineBanner" class="offline-banner" role="status" style="max-width:780px;margin:10px auto 0;padding-inline:12px;"></div>

<main id="mainContent"></main>

<footer class="legal">
  محتوى تعليمي عام مبني على مبادئ تدريب مقاومة معروفة (ACSM/NSCA) — مش بديل عن استشارة مدرب أو طبيب مختص، خصوصًا لو فيه ألم أو إصابة سابقة.
</footer>

<div class="save-msg" id="saveMsg" role="status" aria-live="polite"><svg class="icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> اتحفظ</div>

<!-- GYM MODE OVERLAY -->
<div id="gymOverlay" role="dialog" aria-modal="true" aria-label="وضع الجيم">
  <div class="gym-top glass">
    <button type="button" id="gymExit" data-action="gym-exit">✕ خروج</button>
    <div class="gym-progress"><div class="gym-progress-bar" id="gymProgressBar"></div></div>
    <span id="gymPct" style="font-size:.78rem;color:var(--muted);">0%</span>
  </div>
  <div class="gym-body" id="gymBody"></div>
</div>

<!-- ALTERNATIVES SHEET (Phase 4) — filled by js/modules/alternatives-ui.js -->
<div id="altSheet" class="alt-sheet" hidden>
  <div class="alt-backdrop" data-action="alt-close"></div>
  <div class="alt-panel" id="altPanel" role="dialog" aria-modal="true" aria-labelledby="altTitle"></div>
</div>
<div id="altToast" class="alt-toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
